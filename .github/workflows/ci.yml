name: ci

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

# PR: cancela o run anterior do mesmo PR. master: um run por SHA, sem cancelar.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  OSV_IMAGE: ghcr.io/google/osv-scanner:v2.6.0

jobs:
  fast:
    name: fast
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: O que mudou
        id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          BASE="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > changed.txt
            RANGE="HEAD~1..HEAD"
          else
            git diff --name-only "$BASE" "$HEAD" > changed.txt
            RANGE="$BASE..$HEAD"
          fi
          code=false
          deps=false
          wf=false
          grep -qvE '\.(md|txt)$|^docs/' changed.txt && code=true
          grep -qE '(^|/)(package-lock\.json|pnpm-lock\.yaml|uv\.lock|poetry\.lock|requirements[^/]*\.txt)$' changed.txt && deps=true
          grep -qE '^\.github/' changed.txt && wf=true
          node=false
          [ -f package-lock.json ] && node=true
          echo "code=$code deps=$deps workflows=$wf node=$node range=$RANGE"
          {
            echo "code=$code"
            echo "deps=$deps"
            echo "workflows=$wf"
            echo "node=$node"
            echo "range=$RANGE"
          } >> "$GITHUB_OUTPUT"

      - name: gitleaks (diff)
        env:
          RANGE: ${{ steps.diff.outputs.range }}
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --exit-code 1 --log-opts="$RANGE"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.diff.outputs.code == 'true' && steps.diff.outputs.node == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        if: steps.diff.outputs.code == 'true' && steps.diff.outputs.node == 'true'
        run: npm ci

      - name: verify
        if: steps.diff.outputs.code == 'true' && steps.diff.outputs.node == 'true'
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run verify

      - name: osv-scanner (lockfile mudou)
        if: steps.diff.outputs.deps == 'true'
        run: docker run --rm -v "$PWD:/src" "$OSV_IMAGE" scan source -r /src --config=/src/osv-scanner.toml

      - name: zizmor (workflow mudou)
        if: steps.diff.outputs.workflows == 'true'
        run: pipx run zizmor==1.30.1 --min-severity medium .github/workflows

  risk:
    name: risk
    if: github.event_name == 'pull_request' && vars.AUTO_MERGE == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: classificar e ligar auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          files=$(git diff --name-only "$BASE" "$HEAD")
          lines=$(git diff --shortstat "$BASE" "$HEAD" | awk '{print $4+$6}')
          high='(^|/)(auth|middleware|migrations|supabase)/|\.sql$|^\.github/|(^|/)\.env|vercel\.json|electron-builder|(^|/)prompts?/'
          if echo "$files" | grep -Eq "$high" || [ "${lines:-0}" -gt 400 ]; then RISK=alto; else RISK=baixo; fi
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label risco:baixo,risco:alto >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "risco:$RISK"
          if [ "$RISK" = baixo ]; then gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
          elif ! echo "$LABELS" | grep -q aprovado-filippe; then
            echo "::error::Risco alto: precisa da label aprovado-filippe"; exit 1; fi
